version: '3'
services:
  app:
    build: .
    volumes:
      - .:/code
    #      - bundle:/usr/local/bundle
    #      - node_modules:/code/node_modules
    environment:
      - PORT=3000
      - DATABASE_HOST=pg
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - RAILS_ENV=production
    #      - SHAKAPACKER_DEV_SERVER=http://shakapacker:3035
    ports:
      - "3000:3000"
    links:
      - pg
#    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -p 3000 -b '0.0.0.0'"
    command: bundle exec puma --debug
  pg:
    image: postgres
    environment:
      - POSTGRES_PASSWORD=password
    volumes:
      - pg-data:/var/lib/postgresql/data
#  shakapacker:
#    build: .
#    volumes:
#      - .:/code
#    command: bin/shakapacker-dev-server
#    environment:
#      - NODE_ENV=development
#    ports:
#      - "3035:3035" # Expose Shakapacker dev server
#    depends_on:
#      - app
volumes:
  #  node_modules: {}
  #  bundle: {}
  pg-data: {}
