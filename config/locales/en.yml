en:
  sms:
    authorizations:
      create:
        text: "Verification code for decydujemy.org.pl: %{code}. Do not share it with anyone. Fundacja Demokracja Przyszlosci"
      destroy:
        too_early: "Resetting the verification code is only possible 10 minutes after the previous one was generated."
      update:
        too_many_attempts: "You have exceeded the maximum number of failed verification attempts. Please reset the code."
