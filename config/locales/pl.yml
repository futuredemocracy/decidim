      click_link: "Kliknij tutaj"
      ephemeral_authorized_message: "Pomyślnie zostałeś zweryfikowany.<br/>Rozpocząłeś sesję gościa, możesz teraz uczestniczyć."
      expired_authorization_active_title: "Twoja autoryzacja wygasła."
      finish_authorization_process: "Możesz dokończyć proces autoryzacji"
      pending_authorization_active_message: "W celu ochrony Twojej prywatności, nie przechowujemy Twojego numeru telefonu w formie jawnej. Zamiast tego stosujemy proces zwany hashowaniem. Polega on na zamianie Twojego numeru w unikalny, anonimowy ciąg znaków (tzw. hash) przy użyciu funkcji skrótu. Twój numer telefonu nie jest powiązany z Twoim kontem, a jedynie użyty do autoryzacji."
      pending_authorization_active_title: "Uzupełnij formularz, aby kontynuować tę akcję."
      pending_ephemeral_authorization: "Proszę zweryfikuj swoją tożsamość, aby kontynuować."
    open_data:
      index:
        detailed:
          body_1: "Poniżej znajduje się opis każdego zestawu danych, w tym jego struktura (schemat) oraz rodzaj zawartych w nim informacji:"
          title: "Szczegółowe wyjaśnienie każdego pliku"
        how_to:
          step_1:
            body_html: "Kliknij w poniższe linki, aby pobrać pliki CSV na swój komputer."
            title: "1. Pobierz pliki"
          step_2:
            body_html: |-
              <ul>
                <li><b>Aplikacje arkuszy kalkulacyjnych</b>: Możesz otworzyć pliki CSV za pomocą programów takich jak Microsoft Excel, Google Sheets lub LibreOffice Calc. Wystarczy otworzyć aplikację, wybrać „Otwórz” z menu Plik i wskazać pobrany plik CSV.</li>
                <li><b>Edytory tekstu</b>: Pliki CSV można również otwierać w dowolnym edytorze tekstu, np. Notatnik lub Sublime Text. Zobaczysz wtedy surowe dane, gdzie każda linia odpowiada wierszowi, a wartości są oddzielone przecinkami.</li>
                <li><b>Narzędzia analizy danych</b>: Jeśli znasz narzędzia do analizy danych, takie jak Python (z pandas), R lub bazy danych SQL, możesz zaimportować te pliki CSV bezpośrednio do analizy.</li>
              </ul>
            title: "2. Otwórz pliki"
          step_3:
            body_html: |-
              <ul>
                <li><b>Filtrowanie i sortowanie</b>: W aplikacjach arkuszy kalkulacyjnych możesz filtrować i sortować dane, aby skupić się na konkretnych zestawach informacji.</li>
                <li><b>Analiza</b>: Wykorzystaj dane do przeprowadzania różnych analiz, takich jak zliczanie propozycji, analiza trendów w komentarzach czy ocena uczestnictwa w spotkaniach.</li>
                <li><b>Wizualizacja</b>: Możesz tworzyć wykresy, grafy i inne wizualizacje, aby lepiej interpretować dane.</li>
              </ul>
            title: "3. Praca z danymi"
          title: "Jak otwierać i pracować z tymi plikami"
